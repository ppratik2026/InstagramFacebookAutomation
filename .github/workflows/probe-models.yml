name: Probe GitHub Models
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          tok = os.environ["GITHUB_TOKEN"]
          msgs = [{"role": "user", "content": 'Reply with JSON {"headline": "<a short Gujarati headline about rain in Surat>"}'}]
          tries = [
            ("https://models.github.ai/inference/chat/completions", "openai/gpt-4.1-mini", {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}),
            ("https://models.github.ai/inference/chat/completions", "openai/gpt-4.1-mini", {"Accept": "application/json"}),
            ("https://models.inference.ai.azure.com/chat/completions", "gpt-4o-mini", {}),
            ("https://models.github.ai/orgs/ppratik2026/inference/chat/completions", "openai/gpt-4.1-mini", {"Accept": "application/vnd.github+json"}),
          ]
          for url, model, extra in tries:
              try:
                  r = requests.post(url, json={"model": model, "messages": msgs},
                                    headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json", **extra},
                                    timeout=60, allow_redirects=False)
                  print(url, model, extra, "->", r.status_code, r.headers.get("content-type"), repr(r.text[:300]))
              except Exception as e:
                  print(url, "ERR", e)
          PY
