name: Poster samples

# Many different posters in one run (no reels, nothing is posted). They are saved to the
# "previews" branch in samples-<run number>/ with contact sheets of 10 posters each.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many posters"
        default: "50"
      style:
        description: "mixed (every design) or cartoon (brand template with cartoon scenes)"
        type: choice
        options: [mixed, cartoon]
        default: mixed

permissions:
  contents: write
  models: read

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        # a stuck Ubuntu mirror once hung this step for over half an hour: each try is time-limited
        timeout-minutes: 12
        run: |
          for try in 1 2 3; do
            sudo timeout 150 apt-get update -o Acquire::Retries=3 &&
              sudo timeout 300 apt-get install -y --no-install-recommends -o Acquire::Retries=3 fonts-noto-core fonts-noto-color-emoji && break
            echo "apt try $try failed, retrying"; sleep 15
          done

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Make the posters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u main.py samples --count "${{ inputs.count }}" --style "${{ inputs.style }}"

      - name: Save them to the previews branch
        if: always()
        run: |
          [ -d samples ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="samples-${{ github.run_number }}"
          git fetch origin previews:previews 2>/dev/null || true
          git worktree add -f /tmp/prev previews 2>/dev/null || (git worktree add --detach /tmp/prev && cd /tmp/prev && git checkout --orphan previews && git rm -rfq .)
          mkdir -p "/tmp/prev/$dir"
          for d in samples/*/; do [ -f "$d/card.png" ] && cp "$d/card.png" "/tmp/prev/$dir/$(basename "$d").png"; done
          cp samples/sheet-*.jpg "/tmp/prev/$dir/" 2>/dev/null || true
          cd /tmp/prev
          git add . && git commit -qm "Samples run ${{ github.run_number }}" && git push -q origin previews
          echo "Samples: https://github.com/${{ github.repository }}/tree/previews/$dir"
