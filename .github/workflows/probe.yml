name: Probe insights and vision AI (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip -q install -r requirements.txt
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import base64, json, os, requests
          T, U = os.environ["IG_ACCESS_TOKEN"].strip(), os.environ["IG_USER_ID"].strip()
          G = "https://graph.instagram.com/v21.0"
          me = requests.get(f"{G}/me", params={"fields": "username,followers_count,media_count", "access_token": T}).json()
          print("ME:", me)
          media = requests.get(f"{G}/{U}/media", params={"fields": "id,timestamp,media_product_type,like_count,comments_count,permalink", "limit": 5, "access_token": T}).json()
          print("MEDIA:", json.dumps(media)[:800])
          for m in media.get("data", [])[:3]:
              for metrics in ["views,reach,likes,comments,shares,saved,total_interactions", "reach,likes", "plays"]:
                  r = requests.get(f"{G}/{m['id']}/insights", params={"metric": metrics, "access_token": T})
                  print("INSIGHTS", m["id"], metrics, r.status_code, r.text[:300])
          img = base64.b64encode(open("assets/icons/coin.png", "rb").read()).decode()
          from google import genai
          from google.genai import types
          c = genai.Client()
          for model in ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-flash-latest", "gemini-3.1-flash-lite"]:
              try:
                  r = c.models.generate_content(model=model, contents=[types.Part.from_bytes(data=base64.b64decode(img), mime_type="image/png"), "What is in this picture? 5 words."])
                  print("GEMINI", model, "OK:", r.text[:80])
              except Exception as e:
                  print("GEMINI", model, "FAIL:", str(e)[:160])
          for model in ["meta-llama/llama-4-scout-17b-16e-instruct", "meta-llama/llama-4-maverick-17b-128e-instruct"]:
              r = requests.post("https://api.groq.com/openai/v1/chat/completions", headers={"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"},
                  json={"model": model, "messages": [{"role": "user", "content": [{"type": "text", "text": "What is in this picture? 5 words."}, {"type": "image_url", "image_url": {"url": f"data:image/png;base64,{img}"}}]}]})
              print("GROQ", model, r.status_code, r.text[:200])
          PY
