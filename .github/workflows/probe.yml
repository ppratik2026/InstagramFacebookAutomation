name: Probe Gemini free tier (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip -q install google-genai
          python3 - <<'PY'
          import os
          from google import genai
          from google.genai import types
          c = genai.Client()
          names = [m.name for m in c.models.list()]
          imgs = [n for n in names if "image" in n or "imagen" in n]
          print("image models listed:", imgs)
          try:
              r = c.models.generate_content(model="gemini-2.5-flash", contents="Say OK")
              print("text gemini-2.5-flash: OK", r.text[:20])
          except Exception as e:
              print("text: FAIL", str(e)[:300])
          for m in [n.removeprefix("models/") for n in imgs if "gemini" in n]:
              try:
                  r = c.models.generate_content(model=m, contents="A red apple poster with Gujarati word સફરજન",
                      config=types.GenerateContentConfig(response_modalities=["IMAGE"]))
                  ok = any(p.inline_data for cand in r.candidates or [] for p in (cand.content.parts or []))
                  print(f"image {m}: {'OK image' if ok else 'no image'}")
              except Exception as e:
                  print(f"image {m}: FAIL", str(e)[:250])
          PY
