name: Probe free image models (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 30 https://gen.pollinations.ai/image/models | python3 -c "
          import json,sys
          for m in json.load(sys.stdin):
              if 'image' in m.get('output_modalities',[]):
                  print(m['name'], m.get('aliases'), 'paid_only=',m.get('paid_only'), m.get('pricing'), m.get('description','')[:80])"
