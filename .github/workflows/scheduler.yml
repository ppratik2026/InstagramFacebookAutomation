name: Hourly scheduler

# Posts a reel every hour from 10:00 to midnight IST. GitHub's own schedule drops runs when it is busy,
# so this job stays up and posts on time itself; after ~5.5 hours (jobs stop at 6) it starts the next
# scheduler run, so the chain never ends. The cron below only restarts the chain if it ever stops.
# Free for public repositories. To pause posting: Actions -> Hourly scheduler -> "..." -> Disable workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "13 */4 * * *"

permissions:
  contents: write
  actions: write      # to start the next scheduler run
  models: read

concurrency:
  group: scheduler    # one scheduler at a time; a second one waits for the first to finish
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Post every hour
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python -u main.py scheduler --hours 5.5

      - name: Start the next scheduler run
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scheduler.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
