name: Gujarat news reel

# Fully automatic: news -> poster (AI poster from the Gemini-style prompt, else the template design) -> reel -> post.
on:
  schedule:
    # every hour from 10:00 to 20:00 IST (11 posts a day); cron is UTC: 04:30-14:30 UTC = 10:00-20:00 IST
    - cron: "30 4-14 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "News category"
        type: choice
        options:
          - any
          - government
          - crime
          - good_news
        default: any
      design:
        description: "Poster design"
        type: choice
        options: [auto, bulletin, mag, hero, split, paper]
        default: auto
      publish:
        description: "Post to Instagram (untick to only make the video)"
        type: boolean
        default: true

permissions:
  contents: write
  models: read      # free GitHub Models for the "free" provider

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Make (and post) the reel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CARD_DESIGN: ${{ inputs.design }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.category }}" ] && [ "${{ inputs.category }}" != "any" ]; then ARGS="$ARGS --category ${{ inputs.category }}"; fi
          if [ "${{ inputs.publish }}" = "false" ]; then
            ARGS="$ARGS --no-publish"
            # test runs: skip the stories already shown in earlier previews
            git fetch -q origin previews 2>/dev/null && git log origin/previews --format=%s | sed 's/^Preview run [0-9]*: //' > preview_titles.txt || true
            [ -s preview_titles.txt ] && ARGS="$ARGS --skip-titles preview_titles.txt"
          fi
          python main.py run $ARGS

      - name: Save the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: |
            output/
            !output/**/intro/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remember posted stories
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json || true
          git diff --cached --quiet || (git commit -m "Update posted history" && git push)

      - name: Save the poster preview (test runs only)
        # test runs (publish unticked) also save card.png to the "previews" branch, easy to open in the GitHub app
        if: success() && github.event_name == 'workflow_dispatch' && !inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          card=$(ls output/*/card.png | head -1)
          title=$(python -c "import json,glob; print(json.load(open(sorted(glob.glob('output/*/story.json'))[0]))['headline'])")
          git fetch origin previews:previews 2>/dev/null || true
          git worktree add -f /tmp/prev previews 2>/dev/null || (git worktree add --detach /tmp/prev && cd /tmp/prev && git checkout --orphan previews && git rm -rfq .)
          cp "$card" "/tmp/prev/run-${{ github.run_number }}.png"
          cd /tmp/prev
          git add . && git commit -qm "Preview run ${{ github.run_number }}: $title" && git push -q origin previews
          echo "Preview: https://github.com/${{ github.repository }}/blob/previews/run-${{ github.run_number }}.png"
