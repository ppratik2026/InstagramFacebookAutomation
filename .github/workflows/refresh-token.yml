name: Refresh Instagram token

# Instagram tokens expire after 60 days. This extends it every week.
# Needs a GH_PAT secret (fine-grained token with "Secrets: read and write" on this repo)
# so the workflow can save the new token back into IG_ACCESS_TOKEN.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests PyYAML python-dotenv

      - name: Refresh and save the token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a GH_PAT secret so the refreshed token can be saved. See README."
            exit 1
          fi
          python main.py refresh-token
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < .new_token
          rm -f .new_token
