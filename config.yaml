# Which AI to use:
#   free:   RSS news feeds + GitHub Models (free OpenAI models) + template card. No paid API.
#   gemini: Gemini + Google Search + full AI posters. Needs a Gemini key with billing.
provider: "free"

# What the reels are about.
content:
  region: "Gujarat"
  language: "Gujarati"
  # Categories to look for. Remove any you don't want.
  categories:
    crime: "ક્રાઇમ ન્યૂઝ (crime and police news)"
    good_news: "સારા સમાચાર (positive stories, achievements, development)"
    government: "સરકારી જાહેરાત (government announcements, schemes, exam dates, rules, prices)"
  max_news_age_hours: 48
  hashtags_count: 10
  extra_instructions: ""

# Look of the news card. Colour themes per category are in src/card.py (THEMES).
card:
  # ai_poster: Gemini designs the whole poster (text + illustration), checked for mistakes before use.
  # template:  fixed HTML design (src/card.py) with an AI/stock background. Also the fallback for ai_poster.
  style: "ai_poster"              # only used with provider "gemini"; "free" always uses the template
  handle: "@aehaalogujarat"
  font: "Baloo Bhai 2"            # any Google Font that supports Gujarati

video:
  seconds: 15                     # Instagram needs at least 3s; 12-15s works well for news reels
  fps: 30
  zoom: true                      # slow zoom-in on the image
  music_volume: 0.9               # music from assets/music/*.mp3 (random pick each run)

free:
  # Extra RSS feeds (Gujarati news sites). Google News searches per category are always added.
  # A feed that fails or doesn't exist is skipped, so it's safe to add more.
  feeds:
    - "https://tv9gujarati.com/feed"
    - "https://www.deshgujarat.com/feed/"

github_models:
  # Tried in order; if one is unknown or its free daily limit is used up, the next one is used.
  models: ["openai/gpt-4.1", "openai/gpt-4.1-mini", "openai/gpt-4o-mini"]

gemini:
  text_model: "gemini-3.5-flash"        # news search + card text (Google Search grounding)
  image_model: "gemini-2.5-flash-image" # background illustration for the template card
  # Image models for the full poster, tried in order. The Pro model gives the best design and Gujarati text;
  # if it is unavailable or not enabled on your key, the next one is used.
  poster_models: ["gemini-3-pro-image-preview", "gemini-3.1-flash-image-preview", "gemini-2.5-flash-image"]
  poster_attempts: 3                    # regenerate if the proof-read finds mistakes
  ai_background: true                   # false = Pexels photo / theme colours only

instagram:
  api_version: "v21.0"
  share_to_feed: true
